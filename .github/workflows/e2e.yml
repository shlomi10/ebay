name: ebay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HEADLESS: "true"
      EBAY_BASE_URL: https://www.ebay.com
      EBAY_CART_URL: https://cart.ebay.com/
      EBAY_TIMEOUT_MS: "45000"
      EBAY_BUY_IT_NOW_ONLY: "true"
      EBAY_FREE_SHIPPING_ONLY: "true"
      EBAY_USER: ${{ secrets.EBAY_USER }}
      EBAY_PASS: ${{ secrets.EBAY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run tests
        run: pytest --alluredir=reports/allure-results --html=reports/report.html --self-contained-html

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "24"

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure@3.6.2
          allure generate reports/allure-results -o reports/allure-report
          python - <<'PY'
          from pathlib import Path
          index = Path("reports/allure-report/index.html")
          html = index.read_text(encoding="utf-8")
          if "<base " not in html.lower():
              html = html.replace("<head>", '<head>\n    <base href="/ebay/">', 1)
          index.write_text(html, encoding="utf-8")
          Path("reports/allure-report/404.html").write_text(html, encoding="utf-8")
          PY
          mkdir -p reports/allure-report/data/attachments
          find reports/allure-results -type f \( -name '*.png' -o -name '*attachment*' \) -exec cp -n {} reports/allure-report/data/attachments/ \;

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            reports/report.html
            reports/allure-report
            reports/screenshots
            reports/traces
            reports/allure-results

      - name: Deploy Allure to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          force_orphan: true
          enable_jekyll: false
